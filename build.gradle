plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.decksuggester'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Forces resolution (and download) of every dependency in every configuration,
// even though there is no source yet at this point. Used by the Dockerfile to
// pre-populate the Gradle cache so the actual build can run with --offline.
tasks.register('downloadDependencies') {
    description = 'Resolves and downloads all dependencies for offline use.'
    doLast {
        configurations.findAll { it.canBeResolved }.each { it.files }
    }
}
