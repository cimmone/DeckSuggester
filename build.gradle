plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.decksuggester'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def clientDir = file('client')
def reactBuildOutput = layout.buildDirectory.dir('resources/main/static/ui')
def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()

// On Windows, Gradle spawns npm.cmd through cmd.exe, which refuses a UNC
// working directory (e.g. \\wsl.localhost\...) and silently falls back to
// C:\Windows. Route the npm invocation through wsl.exe instead so it always
// runs against the project's real Linux path, regardless of which JDK
// launched Gradle.
def npmCommandLine = { String... npmArgs ->
    if (!isWindows) {
        return ['npm', *npmArgs]
    }
    def linuxClientDir = providers.exec {
        commandLine 'wsl.exe', 'wslpath', '-a', clientDir.absolutePath
    }.standardOutput.asText.get().trim()
    return ['wsl.exe', '--cd', linuxClientDir, '--', 'npm', *npmArgs]
}

tasks.register('npmInstall', Exec) {
    description = 'Installs the React client dependencies from the pinned lockfile.'
    if (!isWindows) {
        workingDir = clientDir
    }
    commandLine npmCommandLine('ci')
    inputs.file "${clientDir}/package.json"
    inputs.file "${clientDir}/package-lock.json"
    outputs.dir "${clientDir}/node_modules"
}

tasks.register('buildReactClient', Exec) {
    description = 'Builds the React client into a static bundle.'
    dependsOn tasks.named('npmInstall')
    if (!isWindows) {
        workingDir = clientDir
    }
    commandLine npmCommandLine('run', 'build')
    inputs.dir "${clientDir}/src"
    inputs.file "${clientDir}/index.html"
    inputs.file "${clientDir}/vite.config.js"
    outputs.dir "${clientDir}/dist"
}

tasks.register('copyReactClient', Copy) {
    description = 'Copies the built React client into the served static resources.'
    dependsOn tasks.named('buildReactClient')
    from "${clientDir}/dist"
    into reactBuildOutput
}

tasks.named('classes') {
    dependsOn tasks.named('copyReactClient')
}

// Forces resolution (and download) of every dependency in every configuration,
// even though there is no source yet at this point. Used by the Dockerfile to
// pre-populate the Gradle cache so the actual build can run with --offline.
tasks.register('downloadDependencies') {
    description = 'Resolves and downloads all dependencies for offline use.'
    doLast {
        configurations.findAll { it.canBeResolved }.each { it.files }
    }
}
