spring.application.name=decksuggester
server.port=8080

spring.mongodb.uri=mongodb://localhost:27017/scryfall

archidekt.base-url=${ARCHIDEKT_BASE_URL:https://archidekt.com}
archidekt.minimum-request-interval-ms=100
archidekt.rate-limit-wait-ms=5000
archidekt.max-rate-limit-retries=3
archidekt.fixture-directory=${ARCHIDEKT_FIXTURE_DIRECTORY:}

# PBKDF2 uses a random per-password salt; this configured secret is mixed into
# every hash as an application-level pepper (and reused to hash password-reset
# tokens at rest). Set it to a long, private value in every non-development
# deployment and do not change it after users register.
auth.password-salt=${AUTH_PASSWORD_SALT:deck-suggester-development-salt-change-me}
auth.password-reset-minutes=${AUTH_PASSWORD_RESET_MINUTES:30}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.migrations.enabled=${MONGO_MIGRATIONS_ENABLED:true}
